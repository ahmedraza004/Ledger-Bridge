name: LedgerBridge CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Build, Lint, Typecheck & 120+ Test Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledgerbridge_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck Workspace Packages
        run: npm run typecheck

      - name: Run Test Suite (120+ Tests & Coverage Verification)
        run: npm run test:coverage
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/ledgerbridge_test
          REDIS_URL: redis://localhost:6379

      - name: Verify Monorepo Builds
        run: npm run build
